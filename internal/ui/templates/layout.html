{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <script>
    (function(){
        var t = localStorage.getItem('rstash-theme');
        if(t) document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
</head>
<body>
    <div class="shaper" data-active="dots" aria-hidden="true">
        <!-- dots: clustered circles fading from top-right -->
        <svg data-pattern="dots" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <defs>
                <radialGradient id="dots-fade" cx="78%" cy="10%" r="85%">
                    <stop offset="0%" stop-color="white" stop-opacity="1"/>
                    <stop offset="100%" stop-color="white" stop-opacity="0"/>
                </radialGradient>
                <mask id="dots-mask"><rect width="1000" height="1000" fill="url(#dots-fade)"/></mask>
            </defs>
            <g mask="url(#dots-mask)">
                <circle cx="940" cy="40" r="32" class="dot-a"/><circle cx="860" cy="70" r="18" class="dot-b"/><circle cx="770" cy="30" r="26" class="dot-c"/>
                <circle cx="970" cy="130" r="22" class="dot-b"/><circle cx="880" cy="150" r="36" class="dot-a"/><circle cx="790" cy="110" r="14" class="dot-c"/>
                <circle cx="690" cy="60" r="20" class="dot-b"/><circle cx="600" cy="40" r="16" class="dot-a"/><circle cx="930" cy="230" r="28" class="dot-c"/>
                <circle cx="840" cy="250" r="16" class="dot-a"/><circle cx="750" cy="190" r="24" class="dot-b"/><circle cx="650" cy="140" r="12" class="dot-c"/>
                <circle cx="550" cy="90" r="18" class="dot-a"/><circle cx="900" cy="330" r="20" class="dot-a"/><circle cx="810" cy="350" r="30" class="dot-b"/>
                <circle cx="720" cy="290" r="14" class="dot-c"/><circle cx="620" cy="230" r="22" class="dot-a"/><circle cx="520" cy="170" r="10" class="dot-b"/>
                <circle cx="960" cy="400" r="12" class="dot-c"/><circle cx="860" cy="430" r="20" class="dot-c"/><circle cx="770" cy="400" r="10" class="dot-a"/>
                <circle cx="680" cy="350" r="18" class="dot-b"/><circle cx="580" cy="300" r="14" class="dot-c"/><circle cx="480" cy="220" r="16" class="dot-a"/>
                <circle cx="920" cy="520" r="16" class="dot-b"/><circle cx="830" cy="540" r="24" class="dot-a"/><circle cx="740" cy="480" r="12" class="dot-c"/>
                <circle cx="650" cy="440" r="20" class="dot-b"/><circle cx="550" cy="380" r="10" class="dot-a"/><circle cx="450" cy="300" r="14" class="dot-c"/>
                <circle cx="780" cy="600" r="16" class="dot-a"/><circle cx="680" cy="550" r="12" class="dot-b"/><circle cx="580" cy="480" r="18" class="dot-c"/>
                <circle cx="870" cy="630" r="14" class="dot-c"/><circle cx="500" cy="420" r="12" class="dot-a"/>
            </g>
        </svg>
        <!-- waves: layered wave paths along the bottom -->
        <svg data-pattern="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <path d="M0 820 Q150 780 300 820 T600 820 T900 820 T1000 820 V1000 H0Z" class="wave-a"/>
            <path d="M0 860 Q120 830 250 860 T500 870 T750 850 T1000 860 V1000 H0Z" class="wave-b"/>
            <path d="M0 900 Q200 870 400 900 T800 890 T1000 900 V1000 H0Z" class="wave-c"/>
        </svg>
        <!-- strokes: curved arcs sweeping from bottom-left -->
        <svg data-pattern="strokes" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <defs>
                <linearGradient id="strokes-fade" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0%" stop-color="white" stop-opacity="1"/>
                    <stop offset="70%" stop-color="white" stop-opacity="0"/>
                </linearGradient>
                <mask id="strokes-mask"><rect width="1000" height="1000" fill="url(#strokes-fade)"/></mask>
            </defs>
            <g mask="url(#strokes-mask)">
                <path d="M-20 1020 Q300 700 700 400 Q900 280 1020 200" class="stroke-a"/>
                <path d="M-20 1050 Q280 740 680 440 Q880 320 1020 240" class="stroke-b"/>
                <path d="M-50 1020 Q260 720 660 420 Q860 300 1000 220" class="stroke-a"/>
                <path d="M10 1060 Q320 760 720 460 Q920 340 1040 260" class="stroke-c"/>
                <path d="M-40 1080 Q300 780 700 480 Q900 360 1020 280" class="stroke-b"/>
                <path d="M20 1020 Q340 720 740 420 Q940 300 1060 220" class="stroke-c"/>
                <path d="M-60 1040 Q280 760 680 460 Q880 340 1020 260" class="stroke-a"/>
            </g>
        </svg>
        <!-- geometric: scattered hollow hexagons -->
        <svg data-pattern="geometric" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <defs>
                <linearGradient id="geo-fade" x1="0.5" y1="0" x2="0.5" y2="1">
                    <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="white" stop-opacity="0.1"/>
                </linearGradient>
                <mask id="geo-mask"><rect width="1000" height="1000" fill="url(#geo-fade)"/></mask>
            </defs>
            <g mask="url(#geo-mask)">
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-a" transform="translate(120,80) scale(2)"/>
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-b" transform="translate(350,120) scale(1.5)"/>
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-c" transform="translate(600,60) scale(2.5)"/>
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-a" transform="translate(850,180) scale(1.8)"/>
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-b" transform="translate(200,320) scale(3)"/>
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-c" transform="translate(700,280) scale(1.2)"/>
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-a" transform="translate(900,400) scale(2.2)"/>
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-b" transform="translate(450,480) scale(1.6)"/>
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-c" transform="translate(150,550) scale(2)"/>
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-a" transform="translate(650,600) scale(1.4)"/>
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-b" transform="translate(80,750) scale(1.8)"/>
                <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="hex-c" transform="translate(500,700) scale(2.8)"/>
            </g>
        </svg>
        <!-- tiles: grid of squares fading from bottom-left -->
        <svg data-pattern="tiles" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <defs>
                <linearGradient id="tiles-fade" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0%" stop-color="white" stop-opacity="1"/>
                    <stop offset="55%" stop-color="white" stop-opacity="0"/>
                </linearGradient>
                <mask id="tiles-mask"><rect width="1000" height="1000" fill="url(#tiles-fade)"/></mask>
            </defs>
            <g mask="url(#tiles-mask)">
                <rect x="20" y="920" width="22" height="22" rx="3" class="tile-a"/><rect x="60" y="920" width="22" height="22" rx="3" class="tile-b"/><rect x="100" y="920" width="22" height="22" rx="3" class="tile-a"/><rect x="140" y="920" width="22" height="22" rx="3" class="tile-c"/><rect x="180" y="920" width="22" height="22" rx="3" class="tile-b"/><rect x="220" y="920" width="22" height="22" rx="3" class="tile-a"/><rect x="260" y="920" width="22" height="22" rx="3" class="tile-c"/><rect x="300" y="920" width="22" height="22" rx="3" class="tile-b"/><rect x="340" y="920" width="22" height="22" rx="3" class="tile-a"/><rect x="380" y="920" width="22" height="22" rx="3" class="tile-c"/>
                <rect x="40" y="880" width="22" height="22" rx="3" class="tile-b"/><rect x="80" y="880" width="22" height="22" rx="3" class="tile-c"/><rect x="120" y="880" width="22" height="22" rx="3" class="tile-a"/><rect x="160" y="880" width="22" height="22" rx="3" class="tile-b"/><rect x="200" y="880" width="22" height="22" rx="3" class="tile-a"/><rect x="240" y="880" width="22" height="22" rx="3" class="tile-c"/><rect x="280" y="880" width="22" height="22" rx="3" class="tile-a"/><rect x="320" y="880" width="22" height="22" rx="3" class="tile-b"/><rect x="360" y="880" width="22" height="22" rx="3" class="tile-c"/>
                <rect x="60" y="840" width="22" height="22" rx="3" class="tile-c"/><rect x="100" y="840" width="22" height="22" rx="3" class="tile-a"/><rect x="140" y="840" width="22" height="22" rx="3" class="tile-b"/><rect x="180" y="840" width="22" height="22" rx="3" class="tile-c"/><rect x="220" y="840" width="22" height="22" rx="3" class="tile-a"/><rect x="260" y="840" width="22" height="22" rx="3" class="tile-b"/><rect x="300" y="840" width="22" height="22" rx="3" class="tile-a"/><rect x="340" y="840" width="22" height="22" rx="3" class="tile-c"/>
                <rect x="80" y="800" width="22" height="22" rx="3" class="tile-a"/><rect x="120" y="800" width="22" height="22" rx="3" class="tile-b"/><rect x="160" y="800" width="22" height="22" rx="3" class="tile-c"/><rect x="200" y="800" width="22" height="22" rx="3" class="tile-a"/><rect x="240" y="800" width="22" height="22" rx="3" class="tile-b"/><rect x="280" y="800" width="22" height="22" rx="3" class="tile-a"/><rect x="320" y="800" width="22" height="22" rx="3" class="tile-c"/>
                <rect x="100" y="760" width="22" height="22" rx="3" class="tile-b"/><rect x="140" y="760" width="22" height="22" rx="3" class="tile-c"/><rect x="180" y="760" width="22" height="22" rx="3" class="tile-a"/><rect x="220" y="760" width="22" height="22" rx="3" class="tile-c"/><rect x="260" y="760" width="22" height="22" rx="3" class="tile-b"/><rect x="300" y="760" width="22" height="22" rx="3" class="tile-a"/>
                <rect x="120" y="720" width="22" height="22" rx="3" class="tile-c"/><rect x="160" y="720" width="22" height="22" rx="3" class="tile-a"/><rect x="200" y="720" width="22" height="22" rx="3" class="tile-b"/><rect x="240" y="720" width="22" height="22" rx="3" class="tile-a"/><rect x="280" y="720" width="22" height="22" rx="3" class="tile-c"/>
                <rect x="140" y="680" width="22" height="22" rx="3" class="tile-a"/><rect x="180" y="680" width="22" height="22" rx="3" class="tile-b"/><rect x="220" y="680" width="22" height="22" rx="3" class="tile-c"/><rect x="260" y="680" width="22" height="22" rx="3" class="tile-a"/>
                <rect x="160" y="640" width="22" height="22" rx="3" class="tile-b"/><rect x="200" y="640" width="22" height="22" rx="3" class="tile-a"/><rect x="240" y="640" width="22" height="22" rx="3" class="tile-c"/>
                <rect x="180" y="600" width="22" height="22" rx="3" class="tile-c"/><rect x="220" y="600" width="22" height="22" rx="3" class="tile-b"/>
                <rect x="200" y="560" width="22" height="22" rx="3" class="tile-a"/>
            </g>
        </svg>
    </div>
    {{if not .HideHeader}}{{template "header" .}}{{end}}

    <main>
        {{if .Flash}}
            <div role="alert"{{if .Flash.IsError}} class="alert-error"{{end}}>
                {{.Flash.Message}}
            </div>
        {{end}}
        {{template "content" .}}
    </main>

    {{template "footer" .}}
    <script>
    document.querySelectorAll('time[datetime]').forEach(function(el) {
        var d = new Date(el.getAttribute('datetime') + 'Z');
        if (!isNaN(d)) el.textContent = d.toLocaleString();
    });
    </script>
</body>
</html>{{end}}
