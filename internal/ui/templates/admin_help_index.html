{{define "admin_help_index"}}
{{template "admin_nav" $}}
{{with .Content}}

<h2>CLI Reference</h2>
<p style="color:#888;font-size:.85rem;margin-bottom:1rem">
    All available gosilo commands, grouped by category.
</p>

{{range .Groups}}
<h3 style="margin-top:1.5rem">{{.Title}}</h3>
<table style="width:100%;border-collapse:collapse;margin-bottom:.5rem">
    {{range .Commands}}
    <tr>
        <td style="padding:.3rem .75rem .3rem 0;white-space:nowrap">
            <a href="/admin/help/{{commandPath .FullName}}"><code>{{.Name}}</code></a>
        </td>
        <td style="padding:.3rem 0;color:#555">{{.Short}}</td>
    </tr>
    {{end}}
</table>
{{end}}

{{end}}
{{end}}
