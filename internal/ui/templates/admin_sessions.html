{{define "admin_sessions"}}
{{with .Content}}

<h2><a href="/admin/users">&larr; Users</a> / Sessions for {{.Username}}</h2>

{{if .Sessions}}
<form method="POST" action="/admin/users/{{.UserID}}/terminate-all" style="margin-bottom:.75rem"
    onsubmit="return confirm('Terminate all sessions for {{.Username}}?')">
    <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
    <button type="submit" class="btn-danger">Terminate All Sessions</button>
</form>

<table>
    <thead>
        <tr>
            <th>Token</th>
            <th>Created</th>
            <th>Expires</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {{range .Sessions}}
        <tr>
            <td><code>{{.TokenPrefix}}</code></td>
            <td><time datetime="{{.CreatedAt}}">{{.CreatedAt}}</time></td>
            <td><time datetime="{{.ExpiresAt}}">{{.ExpiresAt}}</time></td>
            <td>
                <form method="POST" action="/admin/sessions/{{.TokenFull}}/terminate">
                    <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
                    <button type="submit" class="btn-danger">Terminate</button>
                </form>
            </td>
        </tr>
        {{end}}
    </tbody>
</table>
{{else}}
<p class="empty-state">No active sessions for this user.</p>
{{end}}

{{end}}
{{end}}
