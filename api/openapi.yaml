openapi: 3.0.3
info:
  title: Gosilo remoteStorage API
  description: |
    A remoteStorage server implementing draft-dejong-remotestorage-26.
    Provides WebFinger discovery, OAuth 2.0 authorization, and the
    storage API for documents and folders.
  version: 0.1.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /.well-known/webfinger:
    get:
      summary: WebFinger discovery
      operationId: webfinger
      parameters:
        - name: resource
          in: query
          required: true
          description: "Account URI (acct:user@host)"
          schema:
            type: string
      responses:
        "200":
          description: WebFinger JRD response
          content:
            application/jrd+json:
              schema:
                $ref: "#/components/schemas/WebFingerResponse"
        "400":
          description: Missing or invalid resource parameter
        "404":
          description: User not found

  /oauth/authorize:
    get:
      summary: OAuth 2.0 authorization endpoint
      operationId: oauthAuthorize
      parameters:
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: true
          schema:
            type: string
        - name: response_type
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorization page rendered
        "501":
          description: Not yet implemented

  /oauth/token:
    post:
      summary: OAuth 2.0 token endpoint
      operationId: oauthToken
      responses:
        "501":
          description: Not yet implemented

  /storage/{user}/{path}:
    parameters:
      - name: user
        in: path
        required: true
        description: Username of the storage owner
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: "Document or folder path. Folders end with /"
        schema:
          type: string

    get:
      summary: Get a document or folder listing
      operationId: storageGet
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Document content or folder listing
          headers:
            ETag:
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
            application/ld+json:
              schema:
                $ref: "#/components/schemas/FolderDescription"
        "304":
          description: Not modified (ETag matched)
        "404":
          description: Document or user not found

    put:
      summary: Create or update a document
      operationId: storagePut
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Document updated
          headers:
            ETag:
              schema:
                type: string
        "201":
          description: Document created
          headers:
            ETag:
              schema:
                type: string
        "409":
          description: Conflict (document/folder name clash)
        "412":
          description: Precondition failed (ETag mismatch)

    delete:
      summary: Delete a document
      operationId: storageDelete
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Document deleted
          headers:
            ETag:
              schema:
                type: string
              description: ETag of the deleted version
        "404":
          description: Document not found
        "412":
          description: Precondition failed (ETag mismatch)

    head:
      summary: Get document or folder metadata
      operationId: storageHead
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Headers only (same as GET, no body)
          headers:
            ETag:
              schema:
                type: string
        "304":
          description: Not modified
        "404":
          description: Document or user not found

components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      description: Quoted ETag for conditional update/delete
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: 'Quoted ETag for conditional GET, or "*" to require creation'
      schema:
        type: string

  schemas:
    FolderDescription:
      type: object
      required:
        - "@context"
        - items
      properties:
        "@context":
          type: string
          enum:
            - "http://remotestorage.io/spec/folder-description"
        items:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FolderItem"

    FolderItem:
      type: object
      required:
        - ETag
      properties:
        ETag:
          type: string
        Content-Type:
          type: string
        Content-Length:
          type: integer
          format: int64

    WebFingerResponse:
      type: object
      properties:
        subject:
          type: string
        links:
          type: array
          items:
            type: object
            properties:
              href:
                type: string
              rel:
                type: string
              type:
                type: string
              properties:
                type: object
                additionalProperties:
                  type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
