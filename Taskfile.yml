version: '3'

includes:
  infra:
    taskfile: ./infra/Taskfile.yml
    dir: ./infra
  site:
    taskfile: ./site/Taskfile.yml
    dir: ./site

tasks:
  collect-licenses:
    desc: Collect third-party license information
    cmds:
      - go run ./cmd/collect-licenses

  build:
    desc: Build the rstash binary
    deps: [collect-licenses]
    cmds:
      - go build -o ./build/rstash.exe .

  run:
    desc: Run the server
    cmds:
      - go run .

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet on all packages
    cmds:
      - go vet ./...

  clean:
    desc: Remove build artifacts and local database
    cmds:
      - rm -f ./build/rstash.exe
      - rm -f rstash.db rstash.db-wal rstash.db-shm
      - rm -rf ./dist

  release:
    desc: Cross-compile release binaries for all platforms
    env:
      CGO_ENABLED: "0"
    cmds:
      - cmd: go build -ldflags "-s -w" -o dist/rstash-linux-amd64 .
        env: { GOOS: linux, GOARCH: amd64 }
      - cmd: go build -ldflags "-s -w" -o dist/rstash-linux-arm64 .
        env: { GOOS: linux, GOARCH: arm64 }
      - cmd: go build -ldflags "-s -w" -o dist/rstash-darwin-amd64 .
        env: { GOOS: darwin, GOARCH: amd64 }
      - cmd: go build -ldflags "-s -w" -o dist/rstash-darwin-arm64 .
        env: { GOOS: darwin, GOARCH: arm64 }
      - cmd: go build -ldflags "-s -w" -o dist/rstash-windows-amd64.exe .
        env: { GOOS: windows, GOARCH: amd64 }

  unversioned:
    dir: dist/
    desc: Upsert release binaries to the remote Fossil repo
    aliases:
      - uv
    cmds:
      - fossil uv add *
      - fossil uv sync https://curti@fossil.klutch.software/rstash
