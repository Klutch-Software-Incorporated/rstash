version: '3'

tasks:
  collect-licenses:
    desc: Collect third-party license information
    cmds:
      - go run ./cmd/collect-licenses

  build:
    desc: Build the gosilo binary
    deps: [collect-licenses]
    cmds:
      - go build -ldflags "-X gosilo/internal/config.Version={{.VERSION}}" -o ./build/gosilo.exe .
    vars:
      VERSION:
        sh: fossil info 2>/dev/null | grep "checkout:" | awk '{print substr($NF,1,10)}' || echo "dev"

  run:
    desc: Run the server
    cmds:
      - go run .

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet on all packages
    cmds:
      - go vet ./...

  clean:
    desc: Remove build artifacts and local database
    cmds:
      - rm -f ./build/gosilo.exe
      - rm -f gosilo.db gosilo.db-wal gosilo.db-shm
      - rm -rf ./dist

  release:
    desc: Cross-compile release binaries for all platforms
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X gosilo/internal/config.Version={{.VERSION}}" -o dist/gosilo-linux-amd64 .
      - GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X gosilo/internal/config.Version={{.VERSION}}" -o dist/gosilo-linux-arm64 .
      - GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X gosilo/internal/config.Version={{.VERSION}}" -o dist/gosilo-darwin-amd64 .
      - GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X gosilo/internal/config.Version={{.VERSION}}" -o dist/gosilo-darwin-arm64 .
      - GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X gosilo/internal/config.Version={{.VERSION}}" -o dist/gosilo-windows-amd64.exe .
      - cd dist && sha256sum gosilo-* > checksums.txt
    vars:
      VERSION:
        sh: fossil info 2>/dev/null | grep "checkout:" | awk '{print substr($NF,1,10)}' || echo "dev"
