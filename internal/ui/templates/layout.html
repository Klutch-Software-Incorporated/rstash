{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
    (function(){
        var t = localStorage.getItem('gosilo-theme');
        if(t) document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
</head>
<body>
    {{template "header" .}}

    <main>
        {{if .Flash}}
            <div role="alert"{{if .Flash.IsError}} class="alert-error"{{end}}>
                {{.Flash.Message}}
            </div>
        {{end}}
        {{template "content" .}}
    </main>

    {{template "footer" .}}
    <script>
    document.querySelectorAll('time[datetime]').forEach(function(el) {
        var d = new Date(el.getAttribute('datetime') + 'Z');
        if (!isNaN(d)) el.textContent = d.toLocaleString();
    });
    </script>
</body>
</html>{{end}}
