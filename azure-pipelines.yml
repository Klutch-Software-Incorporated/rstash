name: $(Date:yyyy)$(Date:MM)$(Date:dd).$(Rev:r)

trigger:
  branches:
    include:
      - main

# NOTE: pr: blocks in YAML are IGNORED for Azure Repos. PR validation is
# configured via a Branch Policy on main (Project Settings → Repositories
# → rstash → Policies → main → Build Validation). Leaving the block below
# as documentation; if the repo is ever mirrored to GitHub it'd start
# working automatically.
pr:
  branches:
    include:
      - "*"
  drafts: false

pool:
  vmImage: ubuntu-latest

variables:
  GO_VERSION: '1.24.0'
  NODE_VERSION: '20.x'

stages:
  - stage: BuildTest
    displayName: Build and Test
    jobs:
      - job: BuildTest
        displayName: Build and Test
        steps:
          - task: GoTool@0
            inputs:
              version: $(GO_VERSION)
            displayName: Install Go $(GO_VERSION)

          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: Install Node $(NODE_VERSION)

          - script: |
              set -euo pipefail
              curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b /usr/local/bin
              task --version
            displayName: Install Task

          - script: go mod download
            displayName: Download Go modules

          - script: npm ci
            workingDirectory: site
            displayName: Install site dependencies

          - script: task vet
            displayName: task vet

          - script: task test
            displayName: task test

          # Host-only compile — confirms the code builds without paying for
          # the 5-target cross-compile. Full release build happens later in
          # the PublishFeed stage, only after approval for main-branch runs.
          - script: go build ./...
            displayName: go build ./...

  - stage: PublishFeed
    displayName: Publish to Azure Artifacts
    dependsOn: BuildTest
    # Only publish on main-branch CI runs, never on PR validation runs.
    # Build.Reason is "PullRequest" for PR triggers; Build.SourceBranch is
    # "refs/heads/main" on main-branch pushes.
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: PublishUniversal
        displayName: Publish Universal Package
        # Environment can require approval via Environments UI
        # (Pipelines → Environments → rstash-artifact-feed → Approvals).
        # Approval gates BEFORE any deploy step runs, so the cross-compile
        # below only fires after a human clicks approve.
        environment: rstash-artifact-feed
        strategy:
          runOnce:
            deploy:
              steps:
                # The deployment job runs on a fresh agent with no workspace,
                # so we have to re-install the toolchain and re-checkout the
                # source before we can cross-compile.
                - checkout: self

                - task: GoTool@0
                  inputs:
                    version: $(GO_VERSION)
                  displayName: Install Go $(GO_VERSION)

                - task: NodeTool@0
                  inputs:
                    versionSpec: $(NODE_VERSION)
                  displayName: Install Node $(NODE_VERSION)

                - script: |
                    set -euo pipefail
                    curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b /usr/local/bin
                    task --version
                  displayName: Install Task

                - script: go mod download
                  displayName: Download Go modules

                - script: npm ci
                  workingDirectory: site
                  displayName: Install site dependencies

                # The expensive step. Cross-compiles release binaries for
                # linux-amd64, linux-arm64, darwin-amd64, darwin-arm64,
                # windows-amd64 into dist/. Runs only after approval.
                - script: task build
                  displayName: task build (cross-compile release binaries)

                - script: |
                    set -euo pipefail
                    # Build.BuildNumber was set by `name:` above, e.g. 20260416.1
                    DATE_PART="${BUILD_BUILDNUMBER%.*}"   # 20260416
                    COUNTER="${BUILD_BUILDNUMBER##*.}"    # 1
                    YEAR="${DATE_PART:0:4}"
                    # Strip leading zero from month (semver forbids leading zeros).
                    # Day stays 2-digit; the combined mmdd is still a valid number.
                    MONTH=$((10#${DATE_PART:4:2}))
                    DAY="${DATE_PART:6:2}"
                    VERSION="${YEAR}.${MONTH}${DAY}.${COUNTER}"
                    echo "Computed package version: ${VERSION}"
                    echo "##vso[task.setvariable variable=PackageVersion]${VERSION}"
                  displayName: Compute package version

                - task: UniversalPackages@0
                  inputs:
                    command: publish
                    publishDirectory: dist
                    feedsToUsePublish: internal
                    vstsFeedPublish: rstash/rstash
                    vstsFeedPackagePublish: rstash
                    versionOption: custom
                    versionPublish: $(PackageVersion)
                    packagePublishDescription: rstash $(PackageVersion) from commit $(Build.SourceVersion)
                  displayName: Push binaries to Azure Artifacts feed

                # Docker image build + push to ACR. rstash-infra provisions
                # the registry (rstprdacreus2001) and the Azure DevOps service
                # connection (rstash-acr-eus2) wires this pipeline to it.
                # Tags the image with both the dated version and `latest` so
                # App Service can pin either.
                #
                # Split into separate build + push tasks because Docker@2's
                # `arguments` input is silently ignored by `buildAndPush` — it
                # only takes effect on `build`, `push`, `login`, `logout`, and
                # `run`. Using buildAndPush here meant `--build-arg VERSION=...`
                # never reached `docker build`, leaving every image stamped
                # with the Dockerfile's default (`dev`).
                - task: Docker@2
                  inputs:
                    command: build
                    containerRegistry: rstash-acr-eus2
                    repository: rstash
                    Dockerfile: Dockerfile
                    tags: |
                      $(PackageVersion)
                      latest
                    arguments: --build-arg VERSION=$(PackageVersion)
                  displayName: Build image

                - task: Docker@2
                  inputs:
                    command: push
                    containerRegistry: rstash-acr-eus2
                    repository: rstash
                    tags: |
                      $(PackageVersion)
                      latest
                  displayName: Push image to ACR
