{{define "error_page"}}
<div class="error-page">
    <div class="error-card">
        <p class="error-code">{{with .Content}}{{.Code}}{{end}}</p>
        <h1 class="error-title">{{with .Content}}{{.Title}}{{end}}</h1>
        <p class="error-message">{{with .Content}}{{.Message}}{{end}}</p>
        {{with .Content}}{{if .Detail}}
        <p class="error-detail">{{.Detail}}</p>
        {{end}}{{end}}
    </div>
    <p class="error-back"><a href="/">Back to home</a></p>
</div>
{{end}}
