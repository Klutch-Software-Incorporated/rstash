{{define "login"}}
<div class="form-page">
    <h1>Log In</h1>

    {{with .Content}}
        {{if .Error}}
            <div role="alert" class="alert-error">
                {{.Error}}
                {{if .DisabledMessage}}<div class="disabled-detail">{{safeHTML .DisabledMessage}}</div>{{end}}
            </div>
        {{end}}
    {{end}}

    <form method="POST" action="/login">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="redirect" value="{{with .Content}}{{.RedirectTo}}{{end}}">
        <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username"
                value="{{with .Content}}{{.Username}}{{end}}">
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit">Log In</button>
    </form>
    {{if $.HasMailer}}
    <p style="text-align:center;margin-top:1rem"><a href="/forgot-password">Forgot password?</a></p>
    {{end}}
</div>
{{end}}
