{{define "home"}}
{{/* ===== Logged-out: Server Info ===== */}}
<div class="hero">
    <h1>Welcome to Gosilo</h1>
    <p>A <a href="https://remotestorage.io">remoteStorage</a> server.</p>

    <p style="margin-top:.75rem">
        Registration:
        {{if eq .RegistrationMode "open"}}
            <span class="badge badge-available">Open</span>
        {{else}}
            <span class="badge badge-used">Closed</span>
        {{end}}
    </p>

    <div class="home-cta">
        <a href="/login">Log In</a>
        {{if eq .RegistrationMode "open"}}
            <p class="home-register-link">or <a href="/register">create an account</a></p>
        {{end}}
    </div>
</div>
{{end}}
