name: CI

# Build and test on every push to main and every pull request (including PRs
# from forks — this workflow needs no secrets).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore Rstash.slnx

      - run: dotnet build Rstash.slnx --no-restore -c Release

      - run: dotnet test Rstash.slnx --no-build -c Release --verbosity normal

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit

      # Reads .gitleaksignore automatically; fails the job on any new leak.
      # Run via the container image to avoid pinning a toolchain.
      - name: Run gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-banner
