name: Container image

# Publishes multi-arch images to GHCR.
#
#   push to main   → :edge          (moving, unsupported, whatever just merged)
#   push a v* tag  → :0.5.0, :0.5, :latest
#
# "latest" is deliberately reserved for released tags. Pointing it at main is how people
# end up running a development build in production without meaning to.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write # push to GHCR as GITHUB_TOKEN; no registry secrets needed

jobs:
  image:
    name: Build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives the tag list from the trigger, and emits the OCI labels — including
      # org.opencontainers.image.source, which is what links the package to this repo
      # on GitHub. Lowercases the image name for us; the org name is mixed-case and
      # GHCR only accepts lowercase.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main

      # No QEMU step: the Dockerfile cross-compiles from the build platform and the
      # arm64 stage only COPYs, so nothing foreign is ever executed during the build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Empty on a branch build, so the image self-reports as "+dev".
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
