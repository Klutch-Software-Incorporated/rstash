name: Release

# Cross-compiles the release binaries and attaches them to a GitHub Release.
# Triggered by pushing a CalVer tag, e.g. v2026.0610.1. The version (tag
# without the leading "v") is baked into the binary via the build's ldflags.
# Replaces the old Azure Artifacts Universal Package feed.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  release:
    name: Build & publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: go mod download

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Cross-compile release binaries
        run: task build VERSION="${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rstash-*
          generate_release_notes: true
