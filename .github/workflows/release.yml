name: Release

# Publishes self-contained, single-file binaries and attaches them to a GitHub
# Release. Triggered by pushing a SemVer tag, e.g. v0.4.1 (see CONTRIBUTING.md
# for the bump rules). The numeric version is baked as the assembly Version and
# the full tag (with leading "v") as InformationalVersion.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  release:
    name: Build & publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish all targets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for rid in linux-x64 linux-arm64 win-x64 osx-x64 osx-arm64; do
            echo "::group::publish $rid"
            dotnet publish src/Rstash.Server -c Release -r "$rid" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:Version="$VERSION" \
              -p:InformationalVersion="$GITHUB_REF_NAME" \
              -o "publish/$rid"
            if [ -f "publish/$rid/Rstash.Server.exe" ]; then
              cp "publish/$rid/Rstash.Server.exe" "dist/rstash-$rid.exe"
            else
              cp "publish/$rid/Rstash.Server" "dist/rstash-$rid"
            fi
            echo "::endgroup::"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rstash-*
          generate_release_notes: true
