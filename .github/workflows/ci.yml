name: CI

# Build, vet, and test on every push to main and every pull request
# (including PRs from forks — this workflow needs no secrets). Mirrors the
# BuildTest stage of the old Azure DevOps pipeline.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: go mod download

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - run: task vet

      - run: task test

      # Host-only compile — confirms everything builds. The release
      # cross-compile happens in release.yml on a tag.
      - run: go build ./...

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      # Reuse the Go toolchain rather than pinning a release asset URL.
      # Reads .gitleaksignore automatically; fails the job on any new leak.
      - name: Run gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          "$(go env GOPATH)/bin/gitleaks" detect --source . --redact --no-banner
