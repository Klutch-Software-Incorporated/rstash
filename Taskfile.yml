version: '3'

tasks:
  collect-licenses:
    desc: Collect third-party license information
    cmds:
      - go run ./cmd/collect-licenses

  build:
    desc: Build the rstash binary
    deps: [collect-licenses]
    cmds:
      - go build -ldflags "-X rstash/internal/config.Version={{.VERSION}}" -o ./build/rstash.exe .
    vars:
      VERSION:
        sh: fossil info 2>/dev/null | grep "checkout:" | awk '{print substr($NF,1,10)}' || echo "dev"

  run:
    desc: Run the server
    cmds:
      - go run .

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet on all packages
    cmds:
      - go vet ./...

  clean:
    desc: Remove build artifacts and local database
    cmds:
      - rm -f ./build/rstash.exe
      - rm -f rstash.db rstash.db-wal rstash.db-shm
      - rm -rf ./dist

  site:install:
    desc: Install site dependencies
    dir: site
    cmds:
      - npm install

  site:dev:
    desc: Start site dev server
    dir: site
    cmds:
      - npm run dev

  site:build:
    desc: Build static site
    dir: site
    cmds:
      - npm run build

  site:deploy:
    desc: Build and deploy site to server
    deps:
      - site:build
    cmds:
      - ssh {{.SITE_HOST}} "rm -rf /srv/site && mkdir -p /srv/site"
      - scp -r site/dist/* {{.SITE_HOST}}:/srv/site/
      - ssh {{.SITE_HOST}} "chmod -R o+rX /srv/site/"

  release:
    desc: Cross-compile release binaries for all platforms
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X rstash/internal/config.Version={{.VERSION}}" -o dist/rstash-linux-amd64 .
      - GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X rstash/internal/config.Version={{.VERSION}}" -o dist/rstash-linux-arm64 .
      - GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X rstash/internal/config.Version={{.VERSION}}" -o dist/rstash-darwin-amd64 .
      - GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X rstash/internal/config.Version={{.VERSION}}" -o dist/rstash-darwin-arm64 .
      - GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X rstash/internal/config.Version={{.VERSION}}" -o dist/rstash-windows-amd64.exe .
      - cd dist && sha256sum rstash-* > checksums.txt
    vars:
      VERSION:
        sh: fossil info 2>/dev/null | grep "checkout:" | awk '{print substr($NF,1,10)}' || echo "dev"
